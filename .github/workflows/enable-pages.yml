name: Enable GitHub Pages

on:
  push:
    branches: [gh-pages]

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      contents: read
    steps:
      - name: Enable Pages site via REST API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Enabling Pages site for branch gh-pages..."
          curl -sS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yagyesh127/GuradrailIQ/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}'
